# Профили применения: задачи и оплачиваемые токены условной задачи.
# Семантика профиля — типовая задача-сессия целиком (все шаги агента),
# а не один вызов: input / output / cache_read — суммарные оплачиваемые
# токены такой сессии. Это усреднение по реальным сессиям, а не измерение
# конкретной задачи: реальные задачи отличаются от среднего в разы.
# note — происхождение цифр; обновляйте по реальным сессиям OpenCode
# (opencode api get /api/session — поля tokens.input/output/reasoning/cache).
simple:
  title: Быстрые простые ответы
  input: 2000
  output: 500
  cache_read: 0
  note: короткая сессия почти равна одному вызову; цифры прежние, замеров немного
