# Профили применения: задачи и оплачиваемые токены условной задачи.
# input / output / cache_read — суммарные токены типовой сессии целиком.
# note — происхождение цифр и ограничения сценария.
#
# policy задаёт right-sizing модели:
#   main_min_index   — минимальный Intelligence Index для основного варианта;
#   budget_min_index — минимальный Intelligence Index для бюджетного варианта;
#   max_premium      — допустимое превышение цены над самой дешёвой моделью,
#                      прошедшей main_min_index (только для надёжности/доступности).
# Пороги заданы для текущей версии AA; при смене версии индекса их нужно пересмотреть.
