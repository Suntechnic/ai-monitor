# Профили применения: задачи и оплачиваемые токены условного вызова.
# input / output / cache_read — токены одного условного вызова; cache_read —
# оплаченное чтение кеша за вызов. Это сценарий расчёта, а не измерение:
# реальная агентная задача состоит из многих вызовов и заметно дороже.
# note — происхождение цифр; обновляйте по реальным сессиям OpenCode
# (opencode api get /api/session — поля tokens.input/output/reasoning/cache).
simple:
  title: Быстрые простые ответы
  input: 2000
  output: 500
  cache_read: 0
  note: одиночный ручной вызов без кеша; перенесено из прежнего промпта
html_css:
  title: Вёрстка и правки CSS/HTML
  input: 8000
  output: 2000
  cache_read: 0
  note: перенесено из прежнего промпта; замеров по реальным сессиям нет
js_php_vue:
  title: Небольшие JS/PHP скрипты, Vue-компонент или PHP-класс
  input: 12000
  output: 3000
  cache_read: 0
  note: перенесено из прежнего промпта; по замерам сессий соотношение вход/выход заметно выше, калибровка позже
planning:
  title: Планирование сложной многофайловой проектной работы
  input: 50000
  output: 8000
  cache_read: 30000
  note: input/output перенесены из прежнего промпта; cache_read предварительно по замерам длинных агентных сессий (кеш примерно 0.6 входа), разбивка по этапам будет позже
implementation:
  title: Реализация подготовленного плана
  input: 50000
  output: 8000
  cache_read: 30000
  note: как у planning; замеры по этапам будут позже
review:
  title: Проверка реализации
  input: 50000
  output: 8000
  cache_read: 30000
  note: как у planning; замеры по этапам будут позже
