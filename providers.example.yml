openrouter:
  name: OpenRouter
  url: https://openrouter.ai/api/v1/models
  format: json
  summary: openrouter
  access: Оплата по токенам; только платные модели.
  pricing_notes: В API pricing цены за один токен; умножай на 1000000 для USD за миллион. Агрегированная цена не гарантирована для каждого backend.
deepseek:
  name: DeepSeek напрямую
  url: https://api-docs.deepseek.com/quick_start/pricing/
  format: html
  access: Оплата по токенам.
  pricing_notes: Различай обычный вход, cache read и выход, учитывай peak/off-peak при наличии.
opencode:
  name: OpenCode Go
  url: https://opencode.ai/v2/docs/console/go
  format: html
  access: Только модели в подписке Go; pay-as-you-go вне подписки не рассматривается. Мой тариф не указан.
  pricing_notes: Пиши «включено в подписку» вместо цены вызова. Проверяй квоты и доступность на тарифе; не считай подписку бесплатной.
tokenator:
  name: Токенатор
  url: https://tokenator.cloud/models
  format: html
  summary: tokenator
  access: Оплата рублями или криптой за пакет токенов; только платные модели.
  pricing_notes: Базовая цена 1 млн токенов — 0,27 USD. С баланса списывается (input + output) × множитель модели, поэтому ставка входа и выхода одинакова и равна 0,27 × множитель USD за 1 млн токенов (в summary уже рассчитаны поля input_usd_per_1m и output_usd_per_1m; если multiplier_min и multiplier_max различаются, указывай диапазон).
vantyr:
  name: Vantyr
  url: https://vantyr.xyz/api/pricing
  format: json
  summary: vantyr
  access: Оплата по токенам; очень низкие цены, но нестабильная доступность (бывают обрывы и отказы API), моделей мало.
  pricing_notes: В summary уже рассчитаны тарифы продавца input_usd_per_1m, cache_read_usd_per_1m и output_usd_per_1m в USD за 1 млн токенов (для tiered_expr коэффициенты p, c, cr в billing_expr — прямые цены в USD/1M; для ratio базовая ставка model_ratio=1.0 равна 2,00 USD/1M входа, выход = вход × completion_ratio, cache read = вход × cache_ratio). Отличай их от справочных official_* цен разработчика модели и обязательно учитывай риск нестабильности API.
